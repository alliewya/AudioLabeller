<!DOCTYPE html>
<html>
  <head>
    <title>File Prediction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    {% load static %}
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" />
    <link rel="shortcut icon" href="{% static 'favicon.png' %}" />
  </head>
  <body>
    <div class="container">
      <h1>Predict Files</h1>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="file_browser">Select Audio Files:</label>
          <input
            type="file"
            class="form-control-file"
            id="file_browser"
            name="file_browser"
            multiple
            accept="audio/*"
          />
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>
      </form>
    </div>

    <script>
      document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var fileInput = document.getElementById("file_browser");
        var filePaths = Array.from(fileInput.files).map(function (file) {
          return file.webkitRelativePath || file.name;
        });
        var filePathsInput = document.createElement("input");
        filePathsInput.type = "hidden";
        filePathsInput.name = "file_paths";
        filePathsInput.value = JSON.stringify(filePaths);
        console.log(filePathsInput.value);
        this.appendChild(filePathsInput);
        this.submit();
      });
    </script>
  </body>
</html>
